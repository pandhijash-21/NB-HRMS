  <script>
    (function () {
      var path = window.location.pathname || '';
      if (path.indexOf('/client-portal') === 0) {
        var host = window.location.hostname;
        var port = window.location.port;
        if ((host === 'localhost' || host === '127.0.0.1') && port !== '4000') {
          window.location.replace('http://localhost:4000' + path + window.location.search + window.location.hash);
        } else {
          window.location.replace('/api/client-portal' + window.location.search + window.location.hash);
        }
      }
    })();
  </script>

      var overlay = document.getElementById('nb-splash');

      var statusEl = document.getElementById('nb-splash-status');

      function setStatus(text) {
        if (statusEl) statusEl.textContent = text || '';
      }

      function dismiss() {
        if (dismissed) return;
        dismissed = true;
        overlay.classList.add('nb-off');
        setTimeout(function () { overlay.style.display = 'none'; }, 420);

        e.preventDefault();
        e.stopPropagation();
        dismiss();

        dismiss();
