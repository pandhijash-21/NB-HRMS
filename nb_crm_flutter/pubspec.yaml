name: nb_crm_flutter
description: NB Developer CRM+HRMS+ERP Flutter client (REST-only).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  go_router: ^17.2.3
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.5.5
  google_fonts: ^8.1.0
  flutter_speed_dial : any
  syncfusion_flutter_charts: ^34.1.31
  file_picker: ^11.0.2
  web: ^1.1.1
  local_auth: ^3.0.2
  geolocator: ^14.0.2
  device_info_plus: ^12.4.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
