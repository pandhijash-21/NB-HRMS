table:
  name: leave_balances
  schema: public
object_relationships:
  - name: employee
    using:
      foreign_key_constraint_on: employee_id
  - name: leave_type
    using:
      foreign_key_constraint_on: leave_type_id
select_permissions:
  - role: ADMIN
    permission:
      columns: "*"
      filter: {}
  - role: HR
    permission:
      columns: "*"
      filter: {}
  - role: HR_MANAGER
    permission:
      columns: "*"
      filter: {}
  - role: HOD
    permission:
      columns: "*"
      filter: {}
  - role: HOI
    permission:
      columns: "*"
      filter: {}
  - role: VC
    permission:
      columns: "*"
      filter: {}
  - role: REGISTRAR
    permission:
      columns: "*"
      filter: {}
  - role: EMPLOYEE
    permission:
      columns: [id, employee_id, leave_type_id, year, total_credited, carry_forward, used, pending, available, last_credited_at]
      filter:
        employee_id:
          _eq: X-Hasura-Employee-Id
