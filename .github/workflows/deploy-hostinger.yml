# CI quality gates, then Hostinger deploy (main only).
#
# Deploy never runs unless backend + Flutter checks pass.
# .env.production is never uploaded (SMTP/JWT stay on the VPS).
#
# Required GitHub Actions secrets:
#   HOSTINGER_HOST, HOSTINGER_USER, HOSTINGER_SSH_KEY, TRANSPORT_SECRET
# Optional: HOSTINGER_PORT, API_BASE_URL

name: CI and Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - nb_crm_flutter/**
      - docker-compose.prod.yml
      - deploy/**
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - backend/**
      - nb_crm_flutter/**
      - docker-compose.prod.yml
      - deploy/**
      - .github/workflows/**
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        env:
          # Validate only — no real DB connection required
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npx prisma validate

      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

  test-flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nb_crm_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # Repo has many legacy infos/warnings; fail CI only on analyzer *errors*.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit / widget tests
        run: flutter test

  deploy:
    name: Deploy Hostinger
    needs: [test-backend, test-flutter]
    if: >
      always() &&
      needs.test-backend.result == 'success' &&
      needs.test-flutter.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-hostinger
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          TRANSPORT_SECRET: ${{ secrets.TRANSPORT_SECRET }}
        run: |
          missing=0
          [ -n "$HOST" ] || { echo "Missing secret HOSTINGER_HOST"; missing=1; }
          [ -n "$USER" ] || { echo "Missing secret HOSTINGER_USER"; missing=1; }
          [ -n "$KEY" ] || { echo "Missing secret HOSTINGER_SSH_KEY"; missing=1; }
          [ -n "$TRANSPORT_SECRET" ] || { echo "Missing secret TRANSPORT_SECRET"; missing=1; }
          exit $missing

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter web
        working-directory: nb_crm_flutter
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TRANSPORT_SECRET: ${{ secrets.TRANSPORT_SECRET }}
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=API_BASE_URL="${API_BASE_URL:-https://crm.nbdeveloper.co.in/api}" \
            --dart-define=TRANSPORT_SECRET="$TRANSPORT_SECRET"

      - name: Stage frontend
        run: |
          rm -rf deploy/frontend
          mkdir -p deploy/frontend
          cp -a nb_crm_flutter/build/web/. deploy/frontend/

      # Prefer a key file over ssh-agent — clearer errors if the secret is a .pub by mistake.
      - name: Setup SSH key file
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write secret; fix CRLF and accidental literal \n from copy/paste
          printf '%s\n' "$SSH_KEY" | sed 's/\r$//' | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if head -1 ~/.ssh/deploy_key | grep -qE '^ssh-(ed25519|rsa|dss|ecdsa) '; then
            echo "HOSTINGER_SSH_KEY looks like a PUBLIC key (.pub)."
            echo "Paste the PRIVATE key file: nb_hrms_deploy (no .pub), including BEGIN/END lines."
            exit 1
          fi

          if ! grep -qE 'BEGIN (OPENSSH |RSA )?PRIVATE KEY' ~/.ssh/deploy_key; then
            echo "HOSTINGER_SSH_KEY is not a valid OpenSSH private key (missing BEGIN PRIVATE KEY)."
            echo "Open C:\\Users\\DELL\\.ssh\\nb_hrms_deploy in Notepad and paste the FULL file into the secret."
            exit 1
          fi

          # Ensure trailing newline (required by OpenSSH)
          printf '\n' >> ~/.ssh/deploy_key

          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host hostinger
            HostName ${HOST}
            User ${{ secrets.HOSTINGER_USER }}
            Port ${PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          # Fix leading spaces from heredoc indent
          sed -i 's/^[[:space:]]*//' ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "SSH key file ready"

      - name: Sync files to VPS
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          port="${PORT:-22}"
          remote="${USER}@${HOST}"
          rsh="ssh -i ~/.ssh/deploy_key -p ${port} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          $rsh "$remote" "mkdir -p /opt/nb-crm/backend /opt/nb-crm/deploy/nginx"

          rsync -az --delete -e "$rsh" backend/src/ "$remote:/opt/nb-crm/backend/src/"
          rsync -az --delete -e "$rsh" backend/prisma/ "$remote:/opt/nb-crm/backend/prisma/"
          rsync -az --delete -e "$rsh" backend/docker/ "$remote:/opt/nb-crm/backend/docker/"
          rsync -az --delete -e "$rsh" deploy/frontend/ "$remote:/opt/nb-crm/deploy/frontend/"
          rsync -az --delete -e "$rsh" deploy/nginx/ "$remote:/opt/nb-crm/deploy/nginx/"

          scp -i ~/.ssh/deploy_key -P "$port" -o IdentitiesOnly=yes \
            backend/package.json \
            backend/package-lock.json \
            backend/tsconfig.json \
            backend/Dockerfile.prod \
            "$remote:/opt/nb-crm/backend/"

          scp -i ~/.ssh/deploy_key -P "$port" -o IdentitiesOnly=yes \
            docker-compose.prod.yml \
            "$remote:/opt/nb-crm/docker-compose.prod.yml"

          scp -i ~/.ssh/deploy_key -P "$port" -o IdentitiesOnly=yes \
            deploy/hostinger-apply.sh \
            "$remote:/opt/nb-crm/deploy/hostinger-apply.sh"

      - name: Apply on server
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" -o IdentitiesOnly=yes \
            "${USER}@${HOST}" \
            "chmod +x /opt/nb-crm/deploy/hostinger-apply.sh && sh /opt/nb-crm/deploy/hostinger-apply.sh"
