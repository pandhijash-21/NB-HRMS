table:
  name: leave_approval_steps
  schema: public
object_relationships:
  - name: application
    using:
      foreign_key_constraint_on: application_id
select_permissions:
  - role: ADMIN
    permission:
      columns: "*"
      filter: {}
  - role: HR
    permission:
      columns: "*"
      filter: {}
  - role: HR_MANAGER
    permission:
      columns: "*"
      filter: {}
  - role: HOD
    permission:
      columns: "*"
      filter: {}
  - role: HOI
    permission:
      columns: "*"
      filter: {}
  - role: VC
    permission:
      columns: "*"
      filter: {}
  - role: REGISTRAR
    permission:
      columns: "*"
      filter: {}
  - role: EMPLOYEE
    permission:
      columns: [id, application_id, step_number, approver_role, action, remarks, action_at, is_superseded]
      filter:
        application:
          employee_id:
            _eq: X-Hasura-Employee-Id
