# Hostinger VPS production stack (Traefik already owns :80/:443).
# docker compose -f docker-compose.prod.yml --env-file backend/.env.production up -d --build
# Optional OSRM: docker compose -f docker-compose.prod.yml --profile osrm up -d
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: nb_crm_db
      POSTGRES_USER: ${POSTGRES_USER:-hrms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrms_user} -d nb_crm_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER:-hrms_user}:${POSTGRES_PASSWORD:-hrms_pass}@postgres:5432/nb_crm_db
      REDIS_URL: redis://redis:6379
      PRISMA_CLIENT_ENGINE_TYPE: binary
      PRISMA_CLI_QUERY_ENGINE_TYPE: binary
    ports:
      - "4000:4000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.nbcrm-api.rule=Host(`crm.nbdeveloper.co.in`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/actions`) || PathPrefix(`/events`))
      - traefik.http.routers.nbcrm-api.entrypoints=websecure
      - traefik.http.routers.nbcrm-api.tls.certresolver=letsencrypt
      - traefik.http.routers.nbcrm-api.tls=true
      - traefik.http.routers.nbcrm-api.priority=20
      - traefik.http.routers.nbcrm-api.service=nbcrm-api
      - traefik.http.services.nbcrm-api.loadbalancer.server.port=4000
      - traefik.http.services.nbcrm-api.loadbalancer.passHostHeader=true

  frontend:
    image: nginx:alpine
    restart: always
    volumes:
      - ./deploy/frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.nbcrm-web.rule=Host(`crm.nbdeveloper.co.in`)
      - traefik.http.routers.nbcrm-web.entrypoints=websecure
      - traefik.http.routers.nbcrm-web.tls.certresolver=letsencrypt
      - traefik.http.routers.nbcrm-web.tls=true
      - traefik.http.routers.nbcrm-web.priority=10
      - traefik.http.routers.nbcrm-web.service=nbcrm-web
      - traefik.http.services.nbcrm-web.loadbalancer.server.port=80

  osrm:
    image: osrm/osrm-backend:latest
    profiles: ["osrm"]
    restart: always
    volumes:
      - osrmdata:/data
    expose:
      - "5000"
    command: >
      /bin/bash -c "
      cd /data &&
      if [ ! -f gujarat-latest.osm.pbf ]; then
        apt-get update && apt-get install -y wget &&
        wget -q http://download.geofabrik.de/asia/india/gujarat-latest.osm.pbf;
      fi &&
      if [ ! -f gujarat-latest.osrm ]; then
        osrm-extract -p /opt/car.lua gujarat-latest.osm.pbf &&
        osrm-partition gujarat-latest.osrm &&
        osrm-customize gujarat-latest.osrm;
      fi &&
      osrm-routed --algorithm mld gujarat-latest.osrm
      "

volumes:
  pgdata:
  redisdata:
  osrmdata:
