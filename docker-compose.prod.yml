# Hostinger VPS production stack (Traefik already owns :80/:443).
# docker compose -f docker-compose.prod.yml --env-file backend/.env.production up -d --build
# Optional OSRM: docker compose -f docker-compose.prod.yml --profile osrm up -d
#
# Traefik middlewares (shared labels):
#   nbcrm-secure-headers — HSTS, nosniff, frame deny, referrer policy
#   nbcrm-livekit-strip — strip /rtc prefix before LiveKit (public URL wss://host/rtc)
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: nb_crm_db
      POSTGRES_USER: ${POSTGRES_USER:-hrms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrms_user} -d nb_crm_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      DOCKER: "true"
      PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER:-hrms_user}:${POSTGRES_PASSWORD:-hrms_pass}@postgres:5432/nb_crm_db
      REDIS_URL: redis://redis:6379
      PRISMA_CLIENT_ENGINE_TYPE: binary
      PRISMA_CLI_QUERY_ENGINE_TYPE: binary
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: wss://crm.nbdeveloper.co.in/rtc
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_password}
      MINIO_EGRESS_ENDPOINT: http://minio:9000
      FRONTEND_URL: https://crm.nbdeveloper.co.in
      CORS_ALLOWED_ORIGINS: https://crm.nbdeveloper.co.in
    # Localhost only — public traffic must go through Traefik (VPN gate on web, API middleware).
    ports:
      - "127.0.0.1:4000:4000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.nbcrm-api.rule=Host(`crm.nbdeveloper.co.in`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/actions`) || PathPrefix(`/events`) || PathPrefix(`/socket.io`) || PathPrefix(`/uploads`))
      - traefik.http.routers.nbcrm-api.entrypoints=websecure
      - traefik.http.routers.nbcrm-api.tls.certresolver=letsencrypt
      - traefik.http.routers.nbcrm-api.tls=true
      - traefik.http.routers.nbcrm-api.priority=20
      - traefik.http.routers.nbcrm-api.middlewares=nbcrm-secure-headers@docker
      - traefik.http.routers.nbcrm-api.service=nbcrm-api
      - traefik.http.services.nbcrm-api.loadbalancer.server.port=4000
      - traefik.http.services.nbcrm-api.loadbalancer.passHostHeader=true
      - traefik.http.middlewares.nbcrm-secure-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.nbcrm-secure-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.nbcrm-secure-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.nbcrm-secure-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.nbcrm-secure-headers.headers.frameDeny=true
      - traefik.http.middlewares.nbcrm-secure-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.nbcrm-secure-headers.headers.permissionsPolicy=geolocation=(self), microphone=(self), camera=(self)

  frontend:
    image: nginx:alpine
    restart: always
    volumes:
      - ./deploy/frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/vpn-blocked.html:/usr/share/nginx/html/vpn-blocked.html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.nbcrm-web.rule=Host(`crm.nbdeveloper.co.in`)
      - traefik.http.routers.nbcrm-web.entrypoints=websecure
      - traefik.http.routers.nbcrm-web.tls.certresolver=letsencrypt
      - traefik.http.routers.nbcrm-web.tls=true
      - traefik.http.routers.nbcrm-web.priority=10
      - traefik.http.routers.nbcrm-web.middlewares=nbcrm-secure-headers@docker
      - traefik.http.routers.nbcrm-web.service=nbcrm-web
      - traefik.http.services.nbcrm-web.loadbalancer.server.port=80

  osrm:
    image: osrm/osrm-backend:latest
    profiles: ["osrm"]
    restart: always
    volumes:
      - osrmdata:/data
    expose:
      - "5000"
    command: >
      /bin/bash -c "
      cd /data &&
      if [ ! -f gujarat-latest.osm.pbf ]; then
        apt-get update && apt-get install -y wget &&
        wget -q http://download.geofabrik.de/asia/india/gujarat-latest.osm.pbf;
      fi &&
      if [ ! -f gujarat-latest.osrm ]; then
        osrm-extract -p /opt/car.lua gujarat-latest.osm.pbf &&
        osrm-partition gujarat-latest.osrm &&
        osrm-customize gujarat-latest.osrm;
      fi &&
      osrm-routed --algorithm mld gujarat-latest.osrm
      "

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_password}
    volumes:
      - miniodata:/data
    expose:
      - "9000"
      - "9001"

  livekit:
    image: livekit/livekit-server:v1.8.4
    restart: always
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    depends_on:
      - redis
    labels:
      - traefik.enable=true
      - traefik.http.routers.nbcrm-livekit.rule=Host(`crm.nbdeveloper.co.in`) && PathPrefix(`/rtc`)
      - traefik.http.routers.nbcrm-livekit.entrypoints=websecure
      - traefik.http.routers.nbcrm-livekit.tls.certresolver=letsencrypt
      - traefik.http.routers.nbcrm-livekit.tls=true
      - traefik.http.routers.nbcrm-livekit.priority=30
      - traefik.http.routers.nbcrm-livekit.middlewares=nbcrm-livekit-strip@docker,nbcrm-secure-headers@docker
      - traefik.http.routers.nbcrm-livekit.service=nbcrm-livekit
      - traefik.http.services.nbcrm-livekit.loadbalancer.server.port=7880
      - traefik.http.middlewares.nbcrm-livekit-strip.stripprefix.prefixes=/rtc

  livekit-egress:
    image: livekit/egress:v1.8.4
    restart: always
    depends_on:
      - livekit
      - redis
      - minio
    env_file:
      - ./backend/.env.production
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-secret}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        insecure: true
        log_level: info
    cap_add:
      - SYS_ADMIN
    shm_size: "2gb"

volumes:
  pgdata:
  redisdata:
  osrmdata:
  miniodata:
