# Overrides sticky Netlify UI autofill for this monorepo.

[build]
  base = "nb_crm_flutter"
  command = "git clone https://github.com/flutter/flutter.git -b stable --depth 1 \"$HOME/flutter\" && export PATH=\"$PATH:$HOME/flutter/bin\" && flutter config --no-analytics && flutter precache --web && flutter pub get && flutter build web --release --dart-define=API_BASE_URL=https://nb-crm-api.onrender.com/api"
  publish = "build/web"

[build.environment]
  NODE_VERSION = "20"
