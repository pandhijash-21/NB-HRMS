port: 7880
development: true
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50020
  # Advertise an address the browser can reach. Docker's 172.x IP is not
  # reachable from Chrome, which causes ICE timeouts for guests.
  use_external_ip: false
  node_ip: 127.0.0.1
  # host:port only — the stun: scheme here is parsed as host "stun" with an
  # invalid port, which Chrome rejects as "ICE server parsing failed: Invalid port".
  stun_servers:
    - stun.l.google.com:19302
redis:
  address: redis:6379
keys:
  # Local/dev pair — matches LIVEKIT_API_KEY/SECRET defaults. Rotate in production.
  devkey: secret
logging:
  level: info
