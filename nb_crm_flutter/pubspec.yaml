name: nb_crm_flutter
description: NB CRM — CRM+HRMS+ERP Flutter client (REST-only).
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  go_router: ^17.2.3
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.5.5
  google_fonts: ^8.1.0
  flutter_speed_dial : any
  syncfusion_flutter_charts: ^34.1.31
  file_picker: ^11.0.2
  web: ^1.1.1
  local_auth: ^3.0.1
  geolocator: ^14.0.2
  device_info_plus: ^12.4.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  permission_handler: ^12.0.3
  flutter_background_service: ^5.1.0
  flutter_map_marker_cluster: ^8.2.2
  flutter_3d_controller: ^2.3.0
  flutter_local_notifications: ^19.4.2
  flutter_map_animations: ^0.10.0
  disable_battery_optimization: ^1.1.2
  http: ^1.6.0
  vector_math: ^2.2.0
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1
  socket_io_client: ^3.1.2
  livekit_client: ^2.5.0
  # 1.10+ requires Dart ^3.10 / Flutter >=3.38
  model_viewer_plus: ">=1.9.3 <1.10.0"
  # 6.8+ requires Flutter >=3.44; 6.7.x supports Flutter 3.35
  audioplayers: ">=6.7.1 <6.8.0"
  cryptography: ^2.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: CRMIcons
      fonts:
        - asset: fonts/MaterialIcons-Regular.otf
  assets:
    - assets/images/
    - assets/3d/
    - assets/sounds/

dependency_overrides:
  latlong2: ^0.10.1


