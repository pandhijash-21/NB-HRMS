version: "3.8"
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: hrms_db
      POSTGRES_USER: hrms_user
      POSTGRES_PASSWORD: hrms_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  hasura:
    image: hasura/graphql-engine:v2.36.0
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://hrms_user:hrms_pass@postgres:5432/hrms_db
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: myadminsecret
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"your-super-secret-jwt-key-min-32-chars!!"}'
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public

  backend:
    build: ./backend
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://hrms_user:hrms_pass@postgres:5432/hrms_db
      REDIS_URL: redis://redis:6379
      PORT: 4000
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  pgdata:
