# CI quality gates, then Hostinger deploy (main only).
#
# Mandatory (unchanged architecture):
# - Backend + Flutter checks must pass before deploy
# - Deploy only from main (push or workflow_dispatch)
# - .env.production NEVER uploaded; server secrets stay on VPS
# - TRANSPORT_SECRET is a client-visible transport protocol key (dart-define);
#   NOT for auth/JWT/DB/SMTP. Real security: HTTPS + JWT + RBAC.
# - Production DB: prisma migrate deploy only (no reset/push/seed/accept-data-loss)
# - SSH/rsync Hostinger deploy preserved
#
# Required secrets: HOSTINGER_HOST, HOSTINGER_USER, HOSTINGER_SSH_KEY, TRANSPORT_SECRET
# Optional: HOSTINGER_PORT, API_BASE_URL, HOSTINGER_SSH_KNOWN_HOSTS (pinned host keys)

name: CI and Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - nb_crm_flutter/**
      - whisper/**
      - docker-compose.prod.yml
      - deploy/**
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - backend/**
      - nb_crm_flutter/**
      - whisper/**
      - docker-compose.prod.yml
      - deploy/**
      - .github/workflows/**
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npx prisma validate

      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm test

  test-flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nb_crm_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit / widget tests
        run: flutter test

  migration-safety:
    name: Migration safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan new migrations for destructive SQL
        run: |
          chmod +x deploy/ci-check-migrations.sh
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1 || true
            ./deploy/ci-check-migrations.sh origin/main
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
              git fetch origin main --depth=1 || true
              ./deploy/ci-check-migrations.sh origin/main
            else
              ./deploy/ci-check-migrations.sh "$BEFORE"
            fi
          fi

  build-flutter-web:
    name: Flutter web release build
    needs: [test-flutter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web release
        working-directory: nb_crm_flutter
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TRANSPORT_SECRET: ${{ secrets.TRANSPORT_SECRET }}
        run: |
          # PRs may lack secrets — use a dummy protocol key only to prove the release compile.
          # Main/deploy uses the real TRANSPORT_SECRET (still client-visible by design).
          SECRET="${TRANSPORT_SECRET:-ci-transport-protocol-key}"
          API="${API_BASE_URL:-https://crm.nbdeveloper.co.in/api}"
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -z "${TRANSPORT_SECRET}" ]; then
            echo "Missing TRANSPORT_SECRET for main web build"
            exit 1
          fi
          flutter pub get
          flutter build web --release --no-tree-shake-icons --pwa-strategy=none \
            --dart-define=API_BASE_URL="$API" \
            --dart-define=TRANSPORT_SECRET="$SECRET"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-${{ github.sha }}
          path: nb_crm_flutter/build/web/
          retention-days: 7

  deploy:
    name: Deploy Hostinger
    needs: [test-backend, test-flutter, migration-safety, build-flutter-web]
    if: >
      always() &&
      needs.test-backend.result == 'success' &&
      needs.test-flutter.result == 'success' &&
      needs.migration-safety.result == 'success' &&
      needs.build-flutter-web.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Docker build + npm ci on a small VPS often exceeds default idle SSH timeouts.
    timeout-minutes: 90
    concurrency:
      group: deploy-hostinger
      cancel-in-progress: false
    env:
      # Keep the control channel alive during long remote builds (avoids Broken pipe).
      SSH_OPTS: >-
        -o IdentitiesOnly=yes
        -o StrictHostKeyChecking=yes
        -o UserKnownHostsFile=/home/runner/.ssh/known_hosts
        -o ServerAliveInterval=20
        -o ServerAliveCountMax=180
        -o TCPKeepAlive=yes
        -o ConnectTimeout=30
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          TRANSPORT_SECRET: ${{ secrets.TRANSPORT_SECRET }}
        run: |
          missing=0
          [ -n "$HOST" ] || { echo "Missing secret HOSTINGER_HOST"; missing=1; }
          [ -n "$USER" ] || { echo "Missing secret HOSTINGER_USER"; missing=1; }
          [ -n "$KEY" ] || { echo "Missing secret HOSTINGER_SSH_KEY"; missing=1; }
          [ -n "$TRANSPORT_SECRET" ] || { echo "Missing secret TRANSPORT_SECRET"; missing=1; }
          exit $missing

      - name: Download Flutter web artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-${{ github.sha }}
          path: deploy/frontend

      - name: Setup SSH key file
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" | sed 's/\r$//' | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if head -1 ~/.ssh/deploy_key | grep -qE '^ssh-(ed25519|rsa|dss|ecdsa) '; then
            echo "HOSTINGER_SSH_KEY looks like a PUBLIC key (.pub)."
            exit 1
          fi
          if ! grep -qE 'BEGIN (OPENSSH |RSA )?PRIVATE KEY' ~/.ssh/deploy_key; then
            echo "HOSTINGER_SSH_KEY is not a valid OpenSSH private key."
            exit 1
          fi
          printf '\n' >> ~/.ssh/deploy_key

          : > ~/.ssh/known_hosts
          port="${PORT:-22}"
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" | sed 's/\r$//' > ~/.ssh/known_hosts
            echo "Using pinned HOSTINGER_SSH_KNOWN_HOSTS"
          else
            echo "HOSTINGER_SSH_KNOWN_HOSTS not set — scanning host keys with ssh-keyscan"
            scanned=0
            for attempt in 1 2 3 4 5 6; do
              tmp="$(mktemp)"
              # Do not use -H (hashed) so we can verify the host entry landed.
              if ssh-keyscan -T 20 -p "$port" -t rsa,ecdsa,ed25519 "$HOST" >"$tmp" 2>/tmp/ssh-keyscan.err; then
                if [ -s "$tmp" ] && grep -E '^\S+\s+(ssh-|ecdsa-)' "$tmp" >/dev/null; then
                  cat "$tmp" >> ~/.ssh/known_hosts
                  scanned=1
                  echo "ssh-keyscan ok (attempt $attempt, $(wc -l < "$tmp") key lines)"
                  rm -f "$tmp"
                  break
                fi
              fi
              echo "ssh-keyscan attempt $attempt failed"
              cat /tmp/ssh-keyscan.err 2>/dev/null || true
              rm -f "$tmp"
              sleep $((attempt * 2))
            done
            if [ "$scanned" != 1 ]; then
              echo "ERROR: ssh-keyscan could not fetch host keys for ${HOST}:${port}"
              echo "Fix: ensure the VPS SSH port is reachable from GitHub Actions, or set secret HOSTINGER_SSH_KNOWN_HOSTS to the output of:"
              echo "  ssh-keyscan -p ${port} -t rsa,ecdsa,ed25519 YOUR_HOST"
              exit 1
            fi
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "ERROR: ~/.ssh/known_hosts is empty — refusing to deploy without scanned/pinned host keys"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts
          echo "SSH key file ready (known_hosts lines=$(wc -l < ~/.ssh/known_hosts))"

      - name: Backup previous release on VPS (before overwrite)
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          # shellcheck disable=SC2086
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" $SSH_OPTS \
            "${USER}@${HOST}" 'bash -s' <<'EOS'
          set -e
          cd /opt/nb-crm
          mkdir -p deploy
          if [ -d deploy/frontend ]; then
            rm -rf deploy/frontend.prev
            cp -a deploy/frontend deploy/frontend.prev
            echo "frontend.prev saved"
          fi
          if docker inspect --format='{{.Image}}' nb-crm-backend-1 >/dev/null 2>&1; then
            docker inspect --format='{{.Image}}' nb-crm-backend-1 > .deploy-prev-backend-image
            echo "prev backend image saved"
          fi
          EOS

      - name: Sync files to VPS
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          port="${PORT:-22}"
          remote="${USER}@${HOST}"
          # shellcheck disable=SC2086
          rsh="ssh -p ${port} -i $HOME/.ssh/deploy_key $SSH_OPTS"

          $rsh "$remote" "mkdir -p /opt/nb-crm/backend /opt/nb-crm/deploy/nginx /opt/nb-crm/whisper"

          # --delete only within these app dirs — never .env.production or Docker volumes
          rsync -az --delete -e "$rsh" backend/src/ "$remote:/opt/nb-crm/backend/src/"
          rsync -az --delete -e "$rsh" backend/prisma/ "$remote:/opt/nb-crm/backend/prisma/"
          rsync -az --delete -e "$rsh" backend/docker/ "$remote:/opt/nb-crm/backend/docker/"
          rsync -az --delete -e "$rsh" whisper/ "$remote:/opt/nb-crm/whisper/"
          rsync -az --delete -e "$rsh" deploy/frontend/ "$remote:/opt/nb-crm/deploy/frontend/"
          rsync -az --delete -e "$rsh" deploy/nginx/ "$remote:/opt/nb-crm/deploy/nginx/"

          # scp uses -P for port (-p means preserve timestamps)
          # shellcheck disable=SC2086
          scp -P "$port" -i "$HOME/.ssh/deploy_key" $SSH_OPTS \
            backend/package.json \
            backend/package-lock.json \
            backend/tsconfig.json \
            backend/Dockerfile.prod \
            "$remote:/opt/nb-crm/backend/"

          # shellcheck disable=SC2086
          scp -P "$port" -i "$HOME/.ssh/deploy_key" $SSH_OPTS \
            docker-compose.prod.yml \
            livekit.prod.yaml \
            "$remote:/opt/nb-crm/"

          # shellcheck disable=SC2086
          scp -P "$port" -i "$HOME/.ssh/deploy_key" $SSH_OPTS \
            deploy/hostinger-apply.sh \
            deploy/ci-check-migrations.sh \
            "$remote:/opt/nb-crm/deploy/"

      - name: Apply on server
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          remote="${USER}@${HOST}"
          # -n/-T: never wait on stdin/tty (avoids silent hangs in $(ssh …) polls)
          # shellcheck disable=SC2086
          ssh_cmd() {
            ssh -n -T -i "$HOME/.ssh/deploy_key" -p "$port" $SSH_OPTS \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "$remote" "$@"
          }

          log="/tmp/nb-crm-deploy-${DEPLOY_SHA}.log"
          status="/tmp/nb-crm-deploy-${DEPLOY_SHA}.status"
          pidf="/tmp/nb-crm-deploy-${DEPLOY_SHA}.pid"

          echo "$(date -u +%H:%M:%S) starting remote apply (detached)…"
          # Detach apply so a mid-build SSH drop does not kill docker compose / npm ci.
          start_out=$(ssh_cmd "chmod +x /opt/nb-crm/deploy/hostinger-apply.sh && \
            rm -f '$status' && \
            nohup env DEPLOY_SHA='$DEPLOY_SHA' sh -c \
              \"sh /opt/nb-crm/deploy/hostinger-apply.sh >'$log' 2>&1; echo \\\$? >'$status'\" \
              >/dev/null 2>&1 & echo \$! >'$pidf' && cat '$pidf'")
          echo "$(date -u +%H:%M:%S) remote pid=${start_out} log=${log}"

          # ~75 min of polling (keep under job timeout-minutes: 90)
          for i in $(seq 1 150); do
            echo "$(date -u +%H:%M:%S) poll ${i}/150…"
            out=""
            for attempt in 1 2 3; do
              if out=$(ssh_cmd "\
                if [ -f '$status' ]; then echo DONE:\$(cat '$status'); \
                elif [ -f '$pidf' ] && kill -0 \"\$(cat '$pidf')\" 2>/dev/null; then echo RUNNING; \
                else echo DEAD; fi; \
                echo '---LOG---'; \
                tail -n 30 '$log' 2>/dev/null || echo '(log not ready yet)'"); then
                break
              fi
              echo "$(date -u +%H:%M:%S) poll SSH attempt ${attempt} failed; retrying…"
              sleep 5
              out=""
            done
            if [ -z "$out" ]; then
              echo "ERROR: lost SSH to VPS while polling deploy"
              exit 255
            fi

            echo "$out"
            first=$(printf '%s\n' "$out" | head -1)
            case "$first" in
              DONE:0)
                echo "Remote apply succeeded"
                exit 0
                ;;
              DONE:*)
                code=${first#DONE:}
                echo "Remote apply failed with exit $code"
                exit "${code:-1}"
                ;;
              DEAD)
                echo "ERROR: remote apply process died without writing status"
                exit 1
                ;;
              RUNNING)
                echo "(still building/applying on VPS)"
                ;;
              *)
                echo "Unexpected poll status: $first"
                ;;
            esac
            sleep 20
          done
          echo "ERROR: remote apply timed out"
          exit 1
