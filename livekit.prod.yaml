port: 7880
development: false
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50020
  use_external_ip: true
  # host:port only — do not prefix with stun:
  stun_servers:
    - stun.l.google.com:19302
redis:
  address: redis:6379
keys:
  # Matches LIVEKIT_API_KEY/SECRET defaults and egress config. Rotate in production.
  devkey: secret
logging:
  level: info
